[project]
name = "hier-forecasting"
version = "0.1.0"
description = "Does forecast reconciliation make every level of a hierarchy more accurate, or only coherent? A rolling-origin backtest of five reconcilers over four base forecasters."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "statsforecast>=2.0.1",
]

# Console entry points need a real build backend: a uv virtual project
# ([tool.uv] package = false) installs nothing, so the documented command fails
# with "No module named ..." even while tests pass (pytest's pythonpath hides it).
[project.scripts]
hier-forecast = "hierfc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Keep this path and the [project.scripts] target above in step when renaming the package.
[tool.hatch.build.targets.wheel]
packages = ["src/hierfc"]

[dependency-groups]
dev = [
    "hierarchicalforecast>=1.5.3",
    "hypothesis>=6.170.8",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
